<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VYTS Store</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

header{
  background: linear-gradient(90deg,#0d1b2a,#b3001b);
  color:white;
  text-align:center;
  padding:20px;
}

header img{
  width:100px;
  border-radius:50%;
}

nav{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#1b263b;
  color:white;
}

nav input{
  padding:8px;
  border-radius:6px;
  border:none;
}

.categories{
  text-align:center;
  padding:10px;
}

.categories button{
  margin:5px;
  padding:8px 12px;
  border:none;
  border-radius:20px;
  background:#b3001b;
  color:white;
  cursor:pointer;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:white;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  overflow:hidden;
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.card-content{
  padding:10px;
}

.price{
  color:green;
  font-weight:bold;
}

.actions{
  display:flex;
  justify-content:space-between;
  padding:10px;
}

.cart-btn{
  background:#0d1b2a;
  color:white;
  border:none;
  padding:5px 10px;
  border-radius:5px;
}

.heart{
  border:none;
  background:none;
  font-size:18px;
}

.offer{
  background:#ffcc00;
  text-align:center;
  padding:10px;
  font-weight:bold;
}
</style>

</head>

<body>

<header>
<img src="logo.png">
<h1>VYTS STORE</h1>
<p>Conecta • Protege • Soluciona</p>
</header>

<div class="offer">🔥 OFERTAS HASTA 30% 🔥</div>

<nav>
<input type="text" id="search" placeholder="Buscar producto...">
<div>🛒 <span id="cartCount">0</span></div>
</nav>

<div class="categories">
<button onclick="filter('all')">Todos</button>
<button onclick="filter('laptops')">Laptops</button>
<button onclick="filter('audio')">Audífonos</button>
<button onclick="filter('teclados')">Teclados</button>
<button onclick="filter('camaras')">Cámaras</button>
</div>

<div class="products" id="products">

<!-- LAPTOP -->
<div class="card" data-cat="laptops">
<img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
<div class="card-content">
<h3>Laptop HP 15</h3>
<p>Marca: HP</p>
<p class="price">L. 12,500</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">🤍</button>
</div>
</div>

<div class="card" data-cat="laptops">
<img src="https://images.unsplash.com/photo-1588872657578-7efd1f1555ed">
<div class="card-content">
<h3>Lenovo IdeaPad 3</h3>
<p>Marca: Lenovo</p>
<p class="price">L. 14,000</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">🤍</button>
</div>
</div>

<!-- AUDIFONOS -->
<div class="card" data-cat="audio">
<img src="https://images.unsplash.com/photo-1518441317763-489f0eb41f9d">
<div class="card-content">
<h3>JBL Tune 510BT</h3>
<p>Marca: JBL</p>
<p class="price">L. 1,500</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">🤍</button>
</div>
</div>

<div class="card" data-cat="audio">
<img src="https://images.unsplash.com/photo-1585386959984-a41552262b9c">
<div class="card-content">
<h3>Sony WH-CH520</h3>
<p>Marca: Sony</p>
<p class="price">L. 1,800</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">🤍</button>
</div>
</div>

<!-- TECLADOS -->
<div class="card" data-cat="teclados">
<img src="https://images.unsplash.com/photo-1518770660439-4636190af475">
<div class="card-content">
<h3>Logitech K120</h3>
<p>Marca: Logitech</p>
<p class="price">L. 450</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">🤍</button>
</div>
</div>

<!-- CAMARA -->
<div class="card" data-cat="camaras">
<img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32">
<div class="card-content">
<h3>Canon EOS Rebel T7</h3>
<p class="price">L. 14,500</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">🤍</button>
</div>
</div>

</div>

<script>
let cart = 0;

function addCart(){
  cart++;
  document.getElementById("cartCount").innerText = cart;
}

function fav(btn){
  btn.innerText = "❤️";
}

function filter(cat){
  let cards = document.querySelectorAll(".card");
  cards.forEach(c=>{
    c.style.display = (cat==="all" || c.dataset.cat===cat) ? "block" : "none";
  });
}

document.getElementById("search").addEventListener("input", function(){
  let val = this.value.toLowerCase();
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display = c.innerText.toLowerCase().includes(val) ? "block" : "none";
  });
});
</script>

</body>
</html>
