<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VYTS Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0b0f1a, #1a1f35, #8b0000);
  color: white;
}

header {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: #6cf;
}

input {
  padding: 8px;
  border-radius: 8px;
  border: none;
  width: 250px;
}

.container {
  padding: 20px;
}

.section-title {
  font-size: 26px;
  margin: 20px 0;
  border-bottom: 2px solid #6cf;
  display: inline-block;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
  padding: 15px;
  text-align: center;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  height: 130px;
  object-fit: contain;
}

.price {
  font-size: 18px;
  margin: 5px 0;
}

.discount {
  color: #ff4d4d;
  font-size: 14px;
}

button {
  background: #6cf;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  margin: 5px;
}

button:hover {
  background: #4ac;
}

.cart {
  position: fixed;
  right: 0;
  top: 0;
  width: 300px;
  height: 100%;
  background: #111;
  padding: 15px;
  display: none;
  overflow-y: auto;
}

.cart h2 {
  margin-top: 0;
}

.cart-item {
  border-bottom: 1px solid #444;
  margin-bottom: 10px;
}

.offer {
  background: linear-gradient(90deg,#ff0000,#007bff);
  padding: 20px;
  text-align: center;
  border-radius: 10px;
  margin-bottom: 20px;
}
</style>
</head>

<body>

<header>
  <div class="logo">VYTS Store</div>
  <input type="text" id="search" placeholder="Buscar productos...">
  <button onclick="toggleCart()">🛒</button>
</header>

<div class="container">

<div class="offer">
  🔥 OFERTAS EXCLUSIVAS - Hasta 20% OFF 🔥
</div>

<h2 class="section-title">Computadoras</h2>
<div class="grid" id="products"></div>

<h2 class="section-title">Audífonos</h2>
<div class="grid" id="audio"></div>

<h2 class="section-title">Teclados</h2>
<div class="grid" id="teclados"></div>

<h2 class="section-title">Cámaras</h2>
<div class="grid" id="camaras"></div>

</div>

<div class="cart" id="cart">
  <h2>Carrito</h2>
  <div id="cart-items"></div>
  <h3>Total: L. <span id="total">0</span></h3>
</div>

<script>

let cart = [];

function addToCart(name, price){
  cart.push({name, price});
  renderCart();
}

function renderCart(){
  let container = document.getElementById("cart-items");
  let total = 0;
  container.innerHTML = "";

  cart.forEach(item=>{
    total += item.price;
    container.innerHTML += `<div class="cart-item">${item.name} - L.${item.price}</div>`;
  });

  document.getElementById("total").innerText = total;
}

function toggleCart(){
  let cartDiv = document.getElementById("cart");
  cartDiv.style.display = cartDiv.style.display === "block" ? "none" : "block";
}

function createCard(product){
  return `
  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h4>${product.name}</h4>
    <div class="price">L. ${product.price}</div>
    <div class="discount">${product.discount}</div>
    <button onclick="addToCart('${product.name}', ${product.price})">Comprar</button>
    <button onclick="alert('Añadido a favoritos')">❤️</button>
  </div>`;
}

const productos = [
  {name:"HP 15", price:12500, discount:"-10%"},
  {name:"Lenovo IdeaPad 3", price:14000, discount:"-12%"},
  {name:"Dell Inspiron 15", price:15500, discount:"-8%"},
  {name:"Acer Aspire 5", price:13800, discount:"-15%"},
  {name:"ASUS VivoBook", price:16000, discount:"-10%"},
  {name:"MacBook Air", price:28000, discount:"-5%"}
];

const audio = [
  {name:"JBL Tune 510BT", price:1500, discount:"-10%"},
  {name:"Sony WH-CH520", price:1800, discount:"-12%"},
  {name:"AirPods 2", price:3800, discount:"-8%"},
  {name:"Redragon Hylas", price:1200, discount:"-15%"},
  {name:"Logitech G435", price:2500, discount:"-10%"}
];

const teclados = [
  {name:"Logitech K120", price:450, discount:"-5%"},
  {name:"HP USB", price:600, discount:"-10%"},
  {name:"Redragon Kumara", price:1400, discount:"-12%"},
  {name:"Razer Cynosa", price:2000, discount:"-10%"},
  {name:"Microsoft Wireless", price:1100, discount:"-8%"}
];

const camaras = [
  {name:"Logitech C270", price:850, discount:"-10%"},
  {name:"HP 320 FHD", price:1500, discount:"-10%"},
  {name:"LifeCam HD-3000", price:1200, discount:"-12%"},
  {name:"Hikvision Dome", price:1800, discount:"-15%"},
  {name:"Dahua Bullet", price:2100, discount:"-10%"},
  {name:"TP-Link Tapo C200", price:1300, discount:"-8%"}
];

function load(){
  document.getElementById("products").innerHTML = productos.map(createCard).join("");
  document.getElementById("audio").innerHTML = audio.map(createCard).join("");
  document.getElementById("teclados").innerHTML = teclados.map(createCard).join("");
  document.getElementById("camaras").innerHTML = camaras.map(createCard).join("");
}

load();

document.getElementById("search").addEventListener("input", function(){
  let value = this.value.toLowerCase();
  let all = [...productos, ...audio, ...teclados, ...camaras];

  let results = all.filter(p => p.name.toLowerCase().includes(value));
  document.getElementById("products").innerHTML = results.map(createCard).join("");
});

</script>

</body>
</html>
