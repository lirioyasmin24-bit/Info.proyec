<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VYTS Store</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

/* HEADER */
header{
  background: linear-gradient(90deg,#0d1b2a,#b3001b);
  color:white;
  padding:15px;
  text-align:center;
}

header img{
  width:120px;
  border-radius:50%;
  margin-bottom:10px;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#1b263b;
  color:white;
}

nav input{
  padding:8px;
  width:200px;
  border-radius:6px;
  border:none;
}

/* CATEGORIAS */
.categories{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  padding:10px;
  justify-content:center;
}

.categories button{
  padding:8px 12px;
  border:none;
  border-radius:20px;
  background:#b3001b;
  color:white;
  cursor:pointer;
}

/* SECCIONES */
.section-title{
  padding:20px;
  font-size:22px;
  font-weight:bold;
}

/* PRODUCTOS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  position:relative;
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.card-content{
  padding:10px;
}

.price{
  color:green;
  font-weight:bold;
}

/* BOTONES */
.actions{
  display:flex;
  justify-content:space-between;
  padding:10px;
}

button{
  cursor:pointer;
}

.cart-btn{
  background:#0d1b2a;
  color:white;
  border:none;
  padding:5px;
  border-radius:5px;
}

.heart{
  background:none;
  border:none;
  font-size:18px;
}

/* OFERTAS */
.offer{
  background:#ffcc00;
  padding:10px;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <img src="logo.png">
  <h1>VYTS STORE 💻</h1>
  <p>Conecta. Protege. Soluciona</p>
</header>

<div class="offer">
🔥 OFERTAS ACTIVAS - HASTA 30% DESCUENTO 🔥
</div>

<nav>
  <input type="text" id="search" placeholder="Buscar productos...">
  <div>🛒 Carrito: <span id="cartCount">0</span></div>
</nav>

<div class="categories">
  <button onclick="filter('all')">Todos</button>
  <button onclick="filter('impresoras')">Impresoras</button>
  <button onclick="filter('camaras')">Cámaras</button>
  <button onclick="filter('laptops')">Laptops</button>
  <button onclick="filter('audio')">Audífonos</button>
  <button onclick="filter('relojes')">Relojes</button>
  <button onclick="filter('pc')">PC Escritorio</button>
</div>

<div class="section-title">Productos Destacados</div>

<div class="products">

<!-- IMPRESORA -->
<div class="card" data-cat="impresoras">
<img src="https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04">
<div class="card-content">
<h3>Impresora HP DeskJet</h3>
<p class="price">L. 2,500</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">❤️</button>
</div>
</div>

<!-- CAMARA -->
<div class="card" data-cat="camaras">
<img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32">
<div class="card-content">
<h3>Cámara Canon DSLR</h3>
<p class="price">L. 12,000</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">❤️</button>
</div>
</div>

<!-- LAPTOP -->
<div class="card" data-cat="laptops">
<img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
<div class="card-content">
<h3>Laptop Gamer ASUS</h3>
<p class="price">L. 25,000</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">❤️</button>
</div>
</div>

<!-- AUDIFONOS -->
<div class="card" data-cat="audio">
<img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
<div class="card-content">
<h3>Audífonos Sony</h3>
<p class="price">L. 1,200</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">❤️</button>
</div>
</div>

<!-- RELOJ -->
<div class="card" data-cat="relojes">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
<div class="card-content">
<h3>Smartwatch Xiaomi</h3>
<p class="price">L. 1,800</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">❤️</button>
</div>
</div>

<!-- PC -->
<div class="card" data-cat="pc">
<img src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7">
<div class="card-content">
<h3>PC Escritorio Gamer</h3>
<p class="price">L. 30,000</p>
</div>
<div class="actions">
<button class="cart-btn" onclick="addCart()">Agregar</button>
<button class="heart" onclick="fav(this)">❤️</button>
</div>
</div>

</div>

<script>

let cart = 0;

function addCart(){
  cart++;
  document.getElementById("cartCount").innerText = cart;
}

function fav(btn){
  btn.style.color = "red";
}

function filter(cat){
  let cards = document.querySelectorAll(".card");
  cards.forEach(c=>{
    if(cat==="all" || c.dataset.cat===cat){
      c.style.display="block";
    }else{
      c.style.display="none";
    }
  });
}

document.getElementById("search").addEventListener("input", function(){
  let val = this.value.toLowerCase();
  let cards = document.querySelectorAll(".card");

  cards.forEach(c=>{
    let text = c.innerText.toLowerCase();
    c.style.display = text.includes(val) ? "block" : "none";
  });
});

</script>

</body>
</html>
